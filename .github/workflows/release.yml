name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install Wails
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Linux dependencies (required by Wails)
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # Build app
      - name: Build
        run: wails build

      # Rename binaries (clean naming per OS)
      - name: Rename artifacts
        run: |
          mkdir dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/bin/*.exe dist/hostly-windows.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp -r build/bin/*.app dist/Hostly-macos.app
          else
            cp build/bin/* dist/hostly-linux
          fi

      # Upload release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          name: Hostly ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          body: |
            🚧 Beta Release

            This is a beta version of Hostly.

            ✨ Features:
            - Hosts file management
            - Conflict detection & auto-fix

            ⚠️ Notes:
            - Requires admin/root privileges
            - macOS build may require manual trust
