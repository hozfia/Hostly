name: Build & Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        platform: [linux/amd64, windows/amd64, darwin/universal]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use Wails build action
      - name: Build with Wails
        uses: dAppServer/wails-build-action@v2
        with:
          build-name: hostly
          build-platform: ${{ matrix.platform }}
          package: true

      # Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/bin/*
          name: Hostly ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}